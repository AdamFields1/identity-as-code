# PR validation for the Okta identity-as-code tree (tenants/okta, which holds
# one org per tenant directory and, under each, one cell per stack: the
# okta-config cell of policies and zones, the okta-applications cell of
# sign-on policies, SAML apps, and OIDC apps, and the okta-federation cell
# of upstream identity providers and routing rules, the last two in the
# wave after okta-config; docs/adr/0017).
#
# Static checks run on every PR that touches Terraform or Terragrunt under the
# Okta paths. A speculative plan runs only for cells affected by the change,
# and which cells those are is not decided here: tools/repo_lint/cells.py
# reads the changed paths and selects a cell whose own files changed, every
# cell of a stack that changed, every cell of every stack that composes a
# module that changed, and every cell of the family when root.hcl changed
# (tools/repo_lint/README.md, "Which cells a change touches"). The one rule
# cells.py leaves to the workflow is the workflow itself: an edit to this
# file re-plans everything, said in the detect step below.
#
# Credentials: AWS via GitHub OIDC for the S3 state backend (no static keys),
# Okta token from the "<tenant>-plan" GitHub environment, which holds a
# read-only token. The provider reads OKTA_API_TOKEN from the environment on
# its own; tenants/okta/root.hcl generates no api_token, so the token is in
# no generated file, no plan artifact, and no state. See docs/adr/0003.
#
# Identity per environment: TG_STATE_BUCKET, TG_STATE_REGION, TG_LOCK_TABLE,
# and AWS_PLAN_ROLE_ARN are repository variables a "<tenant>-plan"
# environment may override. GitHub resolves vars.X to the environment value
# when one exists, but only inside a job that names the environment, which
# is why the state variables are set at job level here and not at workflow
# level.
#
# Plans run one job per cell instead of a single `terragrunt run --all plan` so
# each cell gets its own artifact, its own PR comment, and its own concurrency
# group. The result is the same set of plans with better attribution. A
# pull request plan of the applications cell resolves network zones and
# groups by name against the org as it is, so a zone the same pull request
# adds to okta-config plans red in okta-applications until the config cell
# has applied on merge; name the expected red plan in the description.

name: okta-pr-validation

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/okta/**"
      - "stacks/okta-*/**"
      - "tenants/okta/**"
      - "tools/repo_lint/cells.py"
      - ".tflint.hcl"
      - ".github/workflows/okta-pr-validation.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  TG_VERSION: "0.77.0"
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"

concurrency:
  group: okta-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: fmt, tflint, checkov, validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terragrunt hclfmt
        run: terragrunt hclfmt --check

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          set -euo pipefail
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          skip_path: .terragrunt-cache
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: terraform validate (modules and stacks)
        run: |
          set -euo pipefail
          for dir in modules/okta/* stacks/okta-*; do
            [ -d "$dir" ] || continue
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  changed-cells:
    name: Detect affected cells
    runs-on: ubuntu-latest
    # Reads the checkout and nothing else: no OIDC token for a job that
    # never calls a cloud.
    permissions:
      contents: read
    outputs:
      cells: ${{ steps.detect.outputs.cells }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          # cells.py selects the cells the changed paths touch and says why
          # (--explain in the log). The paths go in on standard input, the
          # stdin form of --changed, so a file name is never a shell word.
          # A change to this workflow is not a reason cells.py knows, so it
          # is the one case decided here: plan everything.
          if echo "$changed" | grep -Eq '^\.github/workflows/okta-pr-validation\.yml$'; then
            matrix=$(python3 tools/repo_lint/cells.py --root . --family okta --all --github-matrix)
          else
            matrix=$(echo "$changed" | python3 tools/repo_lint/cells.py --root . --family okta --changed-from - --github-matrix)
          fi
          echo "$changed" | python3 tools/repo_lint/cells.py --root . --family okta --changed-from - --explain

          # The plan job names its environment <tenant>-plan from the cell's
          # tenant, a contract with cells.py. cells.py already refuses a
          # tenant its promotion order does not name; this line holds the
          # job to the two names that exist in repository settings, because
          # an environment GitHub has never been told about is created on
          # first use with no reviewers and no branch policy.
          echo "$matrix" | jq -e '[.cells[].tenant] | all(. == "dev" or . == "prod")' >/dev/null \
            || { echo '::error::a cell sits under a tenant this workflow has no environments for; only dev and prod exist'; exit 1; }

          # Matrix entries carry the cell's path under tenants/okta
          # (family_path), a filesystem-safe id for artifact and concurrency
          # names, and the tenant for the environment lookup.
          cells=$(echo "$matrix" | jq -c '[.cells[] | {family_path, id, tenant}]')
          echo "Affected cells: $cells"
          echo "cells=$cells" >> "$GITHUB_OUTPUT"

  plan:
    name: plan ${{ matrix.cell.family_path }}
    needs: [static-checks, changed-cells]
    # Plans need the state backend; static checks above do not, so they always run.
    if: needs.changed-cells.outputs.cells != '[]' && vars.TG_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.changed-cells.outputs.cells) }}

    # Read-only token lives in the "<tenant>-plan" environment. Sharing the
    # per-cell concurrency group with the release workflow means a PR plan never
    # fights a release apply for the state lock.
    environment: ${{ matrix.cell.tenant }}-plan
    concurrency:
      group: okta-cell-${{ matrix.cell.id }}
      cancel-in-progress: false

    env:
      OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
      TG_STATE_BUCKET: ${{ vars.TG_STATE_BUCKET }}
      TG_STATE_REGION: ${{ vars.TG_STATE_REGION }}
      TG_LOCK_TABLE: ${{ vars.TG_LOCK_TABLE }}
      PLAN_DIR: ${{ github.workspace }}/plans
      # The cell's names as data: run blocks read $CELL_PATH and $CELL_ID,
      # never the matrix expression, so a directory name is never script.
      CELL_PATH: ${{ matrix.cell.family_path }}
      CELL_ID: ${{ matrix.cell.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TG_STATE_REGION }}
          # STS caps a session name at 64 characters; the run, attempt, and
          # matrix index are unique per job and the cell is in the job name.
          role-session-name: okta-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}

      - name: terragrunt plan
        working-directory: tenants/okta/${{ matrix.cell.family_path }}
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/$CELL_ID.tfplan"
          terragrunt show -no-color "$PLAN_DIR/$CELL_ID.tfplan" > "$PLAN_DIR/$CELL_ID.txt"
          terragrunt show -json "$PLAN_DIR/$CELL_ID.tfplan" > "$PLAN_DIR/$CELL_ID.json"

      - name: Plan gate
        id: gate
        # tools/plan_gate holds the plan JSON to the convergence profile and
        # writes its table to the step summary (docs/adr/0018). The verdict
        # is a report, not a block: a pull request's plan is the change
        # under review, so "not converged" goes into the summary and the
        # comment and the reviewer decides. One thing is a block. imports.tf
        # is a one-shot workstation file that git ignores (README, adopting
        # an existing tenant), so an import block in a pull request plan came
        # from a stack's .tf files and would adopt a live object on merge
        # without the zero-change gate of tests/README.md having read it; the
        # job is red until it is gone. Exit 2 is a workflow bug (the plan
        # JSON could not be read) and fails the job either way.
        run: |
          set -euo pipefail
          json="$PLAN_DIR/$CELL_ID.json"
          gate="$PLAN_DIR/$CELL_ID.gate.json"
          code=0
          python3 tools/plan_gate/plan_gate.py convergence "$json" \
            --github-summary --title "Okta plan: $CELL_PATH" \
            --json > "$gate" || code=$?
          echo "profile=convergence" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "verdict=pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=fail" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::plan_gate exited $code for $CELL_PATH: the plan JSON could not be gated. A workflow bug, not a tenant problem."
              exit "$code"
              ;;
          esac
          imports=$(jq '.plans[0].counts.imports' "$gate")
          if [ "$imports" -gt 0 ]; then
            echo "::error::$CELL_PATH plans $imports import block(s) in a pull request. Imports are adopted from a workstation through imports.tf behind the zero-change gate (tests/README.md), never from a pull request; remove the import blocks."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::$CELL_PATH is not converged: this plan changes the tenant. The addresses are in the step summary."
          fi

      - name: Summarise plan
        id: summary
        # The three counts the comment carries; the step summary table is the
        # gate's, above, with the replace, import, and drift columns jq does
        # not see.
        run: |
          set -euo pipefail
          json="$PLAN_DIR/$CELL_ID.json"
          add=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' "$json")
          change=$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length' "$json")
          destroy=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$json")
          echo "add=$add" >> "$GITHUB_OUTPUT"
          echo "change=$change" >> "$GITHUB_OUTPUT"
          echo "destroy=$destroy" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        # Uploaded even when the gate is red, so the plan that
        # failed the gate can be read; nothing to upload when the plan
        # itself failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: okta-plan-${{ matrix.cell.id }}-pr${{ github.event.pull_request.number }}
          path: |
            ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.tfplan
            ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.txt
            ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.json
            ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.gate.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Post plan summary as PR comment
        uses: actions/github-script@v7
        env:
          ADD: ${{ steps.summary.outputs.add }}
          CHANGE: ${{ steps.summary.outputs.change }}
          DESTROY: ${{ steps.summary.outputs.destroy }}
          GATE_PROFILE: ${{ steps.gate.outputs.profile }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        with:
          script: |
            const fs = require('fs');
            const cellPath = process.env.CELL_PATH;
            const cellId = process.env.CELL_ID;
            const marker = `<!-- okta-plan:${cellId} -->`;
            const planPath = `${process.env.PLAN_DIR}/${cellId}.txt`;
            let plan = fs.readFileSync(planPath, 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n... truncated, full plan in the workflow artifact ...';
            }
            const destroyWarning = process.env.DESTROY !== '0'
              ? '\n\n**Warning: this plan destroys resources. Review carefully.**'
              : '';
            const gateLine = process.env.GATE_VERDICT === 'pass'
              ? `Plan gate (${process.env.GATE_PROFILE}): **pass**`
              : `Plan gate (${process.env.GATE_PROFILE}): **not converged**, this plan changes the tenant; the addresses are in the job's step summary`;
            const body = [
              marker,
              `### Okta plan for \`${cellPath}\``,
              `Add: **${process.env.ADD}**, Change: **${process.env.CHANGE}**, Destroy: **${process.env.DESTROY}**${destroyWarning}`,
              gateLine,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
              '',
              `Artifact: \`okta-plan-${cellId}-pr${context.issue.number}\``
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
