  # ---------------------------------------------------------------------------
  govcloud-gate:
    name: gate (govcloud)
    # Every commercial wave is in needs, plan and apply both, so a red plan
    # whose apply was therefore skipped still shows as a failure here; an
    # empty wave shows as skipped and is fine. The gate runs only when the
    # merge-time plan exists, which is only when the gated partition has a
    # cell.
    needs: [cells, plan-wave-0, apply-wave-0, plan-wave-1, apply-wave-1, plan-wave-2, apply-wave-2, plan-wave-3, apply-wave-3, plan-wave-4, apply-wave-4, plan-wave-5, apply-wave-5, plan-gated-wave-0]
    if: >-
      !cancelled()
      && needs.cells.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && needs.plan-gated-wave-0.result == 'success'
    runs-on: ubuntu-latest
    # No cloud step here, so no OIDC token: the gate is the reviewers and the timer.
    permissions: {}
    # The "govcloud" environment carries required reviewers and a wait timer
    # (Settings -> Environments -> govcloud -> Deployment protection rules).
    # The wait timer is the primary soak; the SOAK_MINUTES sleep below is a
    # belt-and-braces fallback for repositories that have not set the timer.
    environment: govcloud
    steps:
      - name: Soak checklist
        env:
          GATED: ${{ needs.cells.outputs.gated_waves }}
        run: |
          cat <<'EOF'
          Commercial has been applied. Before approving GovCloud, confirm:
            1. A member of a commercial group can open the AWS access portal from
               My Apps, sees the expected accounts, and the session ends at the
               permission set's session duration.
            2. The permission sets appear in the commercial Identity Center console
               with the expected policies, and every assigned account shows
               "Provisioned", not "Failed".
            3. No group referenced by the commercial cell is missing from the identity
               store (SCIM from the corp Entra tenant is healthy).
            4. Every commercial account cell applied cleanly: in example-prod the trail
               is delivering to its bucket and GuardDuty is enabled, and in each
               account the roles, keys, and buckets of the workloads cell exist with
               the policies the plan showed.
            5. Each GovCloud plan artifact listed below shows the expected change set
               and no destroys you did not intend; the plan_gate table in the
               merge-time plan job's step summary has the replace and drift columns.
          EOF
          echo "$GATED" | jq -r '.[0][] | "               aws-plan-" + .id + "-${{ github.sha }}"'
      - name: Documented wait
        env:
          SOAK_MINUTES: ${{ vars.SOAK_MINUTES || '0' }}
        run: |
          set -euo pipefail
          echo "Soaking for ${SOAK_MINUTES} minute(s) beyond the environment wait timer."
          sleep "$(( SOAK_MINUTES * 60 ))"

  # ---------------------------------------------------------------------------
  apply-gated-wave-0:
    name: apply ${{ matrix.cell.family_path }} (merge-time plan)
    # Applies the plan the reviewer approved, under the writer identity that
    # lives in govcloud-apply so the approval happens once, at the gate.
    needs: [cells, govcloud-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.cells.outputs.gated_waves)[0] }}
    environment: ${{ matrix.cell.tenant }}-apply
    concurrency:
      group: aws-cell-${{ matrix.cell.id }}
      cancel-in-progress: false
    env:
      CELL_ID: ${{ matrix.cell.id }}
      CELL_PATH: ${{ matrix.cell.family_path }}
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
      TG_AWS_DEPLOY_ROLE_NAME: ${{ vars.TG_AWS_DEPLOY_ROLE_NAME || 'identity-as-code-deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-apply-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      - name: Deployment role profile (account cells only)
        working-directory: tenants/aws/${{ matrix.cell.family_path }}
        run: |
          set -euo pipefail
          # An account cell has account.hcl one level up and partition.hcl
          # above that (tenants/aws/root.hcl, ADDRESSING). The root gives its
          # provider profile = "identity-as-code-<account_name>" and no
          # assume_role; this step fills that profile on the runner with the
          # deployment role this environment names, chained from the OIDC
          # session already in the environment. The role name never enters
          # the plan file. A partition-wide cell has no locator and nothing
          # to do. The last line proves the chain lands in the account the
          # locator names before Terragrunt runs.
          if [ ! -f ../account.hcl ]; then
            echo "No account locator above this cell; the OIDC session is the identity."
            exit 0
          fi
          account_id=$(sed -nE 's/^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"([0-9]{12})".*$/\1/p' ../account.hcl)
          account_name=$(sed -nE 's/^[[:space:]]*account_name[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' ../account.hcl)
          partition=$(sed -nE 's/^[[:space:]]*partition[[:space:]]*=[[:space:]]*"(aws|aws-us-gov)".*$/\1/p' ../../../partition.hcl)
          if [ -z "$account_id" ] || [ -z "$account_name" ] || [ -z "$partition" ]; then
            echo "Could not read account_id and account_name from ../account.hcl and partition from ../../../partition.hcl."
            exit 1
          fi
          profile="identity-as-code-${account_name}"
          aws configure set --profile "$profile" role_arn "arn:${partition}:iam::${account_id}:role/${TG_AWS_DEPLOY_ROLE_NAME}"
          aws configure set --profile "$profile" credential_source Environment
          aws configure set --profile "$profile" role_session_name "aws-release-apply-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}"
          landed=$(aws sts get-caller-identity --profile "$profile" --query Account --output text)
          if [ "$landed" != "$account_id" ]; then
            echo "Profile $profile landed in account $landed, not $account_id."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: aws-plan-${{ matrix.cell.id }}-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (saved plan)
        working-directory: tenants/aws/${{ matrix.cell.family_path }}
        run: |
          set -euo pipefail
          terragrunt init -input=false
