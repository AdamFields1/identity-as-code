# Release train for the AWS identity-as-code tree.
#
#   push to main
#     |-- plan-commercial ---> apply-commercial   (commercial/aws-identity-center)
#     |                               |
#     |                               |-- example-prod: plan/apply aws-account-baseline
#     |                               |       ---> plan/apply aws-account-workloads
#     |                               |       ---> plan/apply payments-api
#     |                               |-- example-dev:  plan/apply aws-account-baseline
#     |                               |       ---> plan/apply aws-account-workloads
#     |                                \
#     |-- plan-govcloud (merge-time plan, saved as artifact)
#                 \                     \
#                  govcloud-gate (environment: govcloud, reviewers + wait timer)
#                       |
#                  apply-govcloud (environment: govcloud-apply, applies the merge-time plan)
#
# Commercial is the first partition, the way dev is for Okta and corp is for
# Azure. GovCloud is the gated one. Its plan is taken at merge time and saved;
# the reviewer approves that exact plan. If GovCloud state moves between merge
# and approval, Terraform refuses the stale plan and the release must be
# re-run, which is the safe failure.
#
# Account cells (docs/adr/0017) follow the partition-wide Identity Center
# cell, one chain per account, the accounts in parallel because their state
# files and deployment roles are separate. Inside an account the order is
# one rule for every account: aws-account-baseline, then
# aws-account-workloads, then the app stacks under stacks/apps/aws. The
# baseline goes first because it is what makes the account safe to put
# things in (the trail, the public access block, the password policy); the
# catalog goes second because it is where an application's account-level
# prerequisites are declared when it has any; the app stacks go last. No
# cell reads another cell's outputs, so the order is a release rule, not a
# Terragrunt dependency, and it is stated once, here. The gate waits for the
# last apply of every account, so commercial is complete before GovCloud
# opens. GovCloud has no account cells yet; when it does, they follow
# apply-govcloud in the same chain shape under the govcloud environments.
#
# The two partitions share nothing at runtime: different OIDC roles (a GovCloud
# role ARN starts arn:aws-us-gov), different state buckets (a GovCloud identity
# cannot write to a commercial bucket), different Identity Center instances.
# They share the stack, the modules, and this workflow shape. See docs/adr/0009.
#
# Credentials: AWS via GitHub OIDC (aws-actions/configure-aws-credentials with
# a role ARN from a repository variable, no access keys). See docs/adr/0003.
# An account cell's job additionally runs its provider as the deployment
# role every account carries,
# arn:<partition>:iam::<account id>:role/<TG_AWS_DEPLOY_ROLE_NAME>. That role
# is in no generated file: tenants/aws/root.hcl gives an account cell's
# provider profile = "identity-as-code-<account name>" and no assume_role,
# because a saved plan carries the generated provider with it and the apply
# job would otherwise assume the role the plan job named. The "Deployment
# role profile" step in every account job writes that profile on the runner
# from the locators beside the cell and the job environment's
# TG_AWS_DEPLOY_ROLE_NAME, chained from the OIDC session with
# credential_source = Environment, so the plan job runs as the reader and
# the apply job as the writer while the plan file names neither. The state
# backend keeps the OIDC session; the deployment roles never touch state.
#
# Environments (configured in repository settings, no secrets in this repo).
# AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN, TG_AWS_STATE_BUCKET, TG_AWS_STATE_REGION,
# TG_AWS_LOCK_TABLE, and TG_AWS_DEPLOY_ROLE_NAME are repository variables that
# each environment overrides with its own partition's role and bucket:
#   commercial-plan    reader role in the commercial delegated admin account, plan only;
#                      TG_AWS_DEPLOY_ROLE_NAME names the read-only deployment role in
#                      every account, which trusts only this environment's OIDC role
#   commercial         writer role in the commercial delegated admin account;
#                      TG_AWS_DEPLOY_ROLE_NAME names the writer deployment role in
#                      every account, which trusts only this environment's OIDC role
#   govcloud-plan      reader role in the GovCloud delegated admin account, plan only
#   govcloud           no identity; carries the required reviewers and the wait timer
#   govcloud-apply     writer role in the GovCloud delegated admin account; deployment branch policy: main only
#
# The reader deployment role trusting only the plan OIDC role, and the writer
# only the apply OIDC role, is what keeps a pull request's plan from reaching
# a writer anywhere in the estate. Both roles are platform bootstrap (README,
# deliberately out of scope).
#
# The writer role lives in govcloud-apply rather than govcloud so the reviewer
# approves once, at the gate. apply-govcloud cannot start without govcloud-gate
# succeeding.

name: aws-release

on:
  push:
    branches: [main]
    paths:
      - "modules/aws/**"
      - "stacks/aws-*/**"
      - "stacks/apps/aws/**"
      - "tenants/aws/**"
      - ".github/workflows/aws-release.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  TG_VERSION: "0.77.0"
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"
  PLAN_DIR: ${{ github.workspace }}/plans

# Releases queue behind each other and are never cancelled mid-apply.
concurrency:
  group: aws-release-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  plan-commercial:
    name: plan commercial/aws-identity-center
    # Skip the whole train until the repo variables for the state backend exist.
    # Without this guard every push to main would fail on a portfolio repo that
    # has no live backend behind it. Downstream jobs inherit the skip through needs.
    if: vars.TG_AWS_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    environment: commercial-plan
    concurrency:
      group: aws-cell-commercial-aws-identity-center
      cancel-in-progress: false
    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-plan-commercial-${{ github.run_id }}
      - name: terragrunt plan
        working-directory: tenants/aws/commercial/aws-identity-center
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/commercial-aws-identity-center.tfplan"
          terragrunt show -no-color "$PLAN_DIR/commercial-aws-identity-center.tfplan" > "$PLAN_DIR/commercial-aws-identity-center.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-plan-commercial-aws-identity-center-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/commercial-aws-identity-center.*
          retention-days: 30

  # ---------------------------------------------------------------------------
  apply-commercial:
    name: apply commercial/aws-identity-center
    needs: [plan-commercial]
    runs-on: ubuntu-latest
    environment: commercial
    concurrency:
      group: aws-cell-commercial-aws-identity-center
      cancel-in-progress: false
    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-apply-commercial-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: aws-plan-commercial-aws-identity-center-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (saved plan)
        working-directory: tenants/aws/commercial/aws-identity-center
        run: |
          set -euo pipefail
          terragrunt init -input=false
          terragrunt apply -input=false -lock-timeout=5m "$PLAN_DIR/commercial-aws-identity-center.tfplan"

  # ---------------------------------------------------------------------------
  plan-example-prod-baseline:
    name: plan commercial/accounts/example-prod/aws-account-baseline
    # First account cell of example-prod, after the partition-wide Identity
    # Center cell. The provider runs as the read-only deployment role that
    # TG_AWS_DEPLOY_ROLE_NAME names in the commercial-plan environment, in
    # the account the locator beside the cell addresses (docs/adr/0017),
    # through the profile the step below writes.
    needs: [apply-commercial]
    runs-on: ubuntu-latest
    environment: commercial-plan
    concurrency:
      group: aws-cell-commercial-accounts-example-prod-aws-account-baseline
      cancel-in-progress: false
    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
      TG_AWS_DEPLOY_ROLE_NAME: ${{ vars.TG_AWS_DEPLOY_ROLE_NAME || 'identity-as-code-deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-plan-example-prod-baseline-${{ github.run_id }}
      - name: Deployment role profile (from the cell's locators)
        working-directory: tenants/aws/commercial/accounts/example-prod/aws-account-baseline
        run: |
          set -euo pipefail
          # The root gives this cell's provider profile = "identity-as-code-<account_name>"
          # and no assume_role (tenants/aws/root.hcl): a saved plan carries the
          # generated provider with it, and the apply job names a different
          # role than the plan job. This step fills that profile on the runner
          # from the locators beside the cell and this environment's
          # TG_AWS_DEPLOY_ROLE_NAME, chained from the OIDC session already in
          # the environment. The state backend keeps the OIDC session; only
          # the provider uses the profile. The last line proves the chain
          # lands in the account the locator names before Terragrunt runs.
          account_id=$(sed -nE 's/^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"([0-9]{12})".*$/\1/p' ../account.hcl)
          account_name=$(sed -nE 's/^[[:space:]]*account_name[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' ../account.hcl)
          partition=$(sed -nE 's/^[[:space:]]*partition[[:space:]]*=[[:space:]]*"(aws|aws-us-gov)".*$/\1/p' ../../../partition.hcl)
          if [ -z "$account_id" ] || [ -z "$account_name" ] || [ -z "$partition" ]; then
            echo "Could not read account_id and account_name from ../account.hcl and partition from ../../../partition.hcl."
            exit 1
          fi
          profile="identity-as-code-${account_name}"
          aws configure set --profile "$profile" role_arn "arn:${partition}:iam::${account_id}:role/${TG_AWS_DEPLOY_ROLE_NAME}"
          aws configure set --profile "$profile" credential_source Environment
          aws configure set --profile "$profile" role_session_name "aws-release-${{ github.job }}-${{ github.run_id }}"
          landed=$(aws sts get-caller-identity --profile "$profile" --query Account --output text)
          if [ "$landed" != "$account_id" ]; then
            echo "Profile $profile landed in account $landed, not $account_id."
            exit 1
          fi

      - name: terragrunt plan
        working-directory: tenants/aws/commercial/accounts/example-prod/aws-account-baseline
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/commercial-accounts-example-prod-aws-account-baseline.tfplan"
          terragrunt show -no-color "$PLAN_DIR/commercial-accounts-example-prod-aws-account-baseline.tfplan" > "$PLAN_DIR/commercial-accounts-example-prod-aws-account-baseline.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-plan-commercial-accounts-example-prod-aws-account-baseline-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/commercial-accounts-example-prod-aws-account-baseline.*
          retention-days: 30

  # ---------------------------------------------------------------------------
  apply-example-prod-baseline:
    name: apply commercial/accounts/example-prod/aws-account-baseline
    needs: [plan-example-prod-baseline]
    runs-on: ubuntu-latest
    environment: commercial
    concurrency:
      group: aws-cell-commercial-accounts-example-prod-aws-account-baseline
      cancel-in-progress: false
    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
      TG_AWS_DEPLOY_ROLE_NAME: ${{ vars.TG_AWS_DEPLOY_ROLE_NAME || 'identity-as-code-deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-apply-example-prod-baseline-${{ github.run_id }}
      - name: Deployment role profile (from the cell's locators)
        working-directory: tenants/aws/commercial/accounts/example-prod/aws-account-baseline
        run: |
          set -euo pipefail
          # The root gives this cell's provider profile = "identity-as-code-<account_name>"
          # and no assume_role (tenants/aws/root.hcl): a saved plan carries the
          # generated provider with it, and the apply job names a different
          # role than the plan job. This step fills that profile on the runner
          # from the locators beside the cell and this environment's
          # TG_AWS_DEPLOY_ROLE_NAME, chained from the OIDC session already in
          # the environment. The state backend keeps the OIDC session; only
          # the provider uses the profile. The last line proves the chain
          # lands in the account the locator names before Terragrunt runs.
          account_id=$(sed -nE 's/^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"([0-9]{12})".*$/\1/p' ../account.hcl)
          account_name=$(sed -nE 's/^[[:space:]]*account_name[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' ../account.hcl)
          partition=$(sed -nE 's/^[[:space:]]*partition[[:space:]]*=[[:space:]]*"(aws|aws-us-gov)".*$/\1/p' ../../../partition.hcl)
          if [ -z "$account_id" ] || [ -z "$account_name" ] || [ -z "$partition" ]; then
            echo "Could not read account_id and account_name from ../account.hcl and partition from ../../../partition.hcl."
            exit 1
          fi
          profile="identity-as-code-${account_name}"
          aws configure set --profile "$profile" role_arn "arn:${partition}:iam::${account_id}:role/${TG_AWS_DEPLOY_ROLE_NAME}"
          aws configure set --profile "$profile" credential_source Environment
          aws configure set --profile "$profile" role_session_name "aws-release-${{ github.job }}-${{ github.run_id }}"
          landed=$(aws sts get-caller-identity --profile "$profile" --query Account --output text)
          if [ "$landed" != "$account_id" ]; then
            echo "Profile $profile landed in account $landed, not $account_id."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: aws-plan-commercial-accounts-example-prod-aws-account-baseline-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (saved plan)
        working-directory: tenants/aws/commercial/accounts/example-prod/aws-account-baseline
        run: |
          set -euo pipefail
          terragrunt init -input=false
          terragrunt apply -input=false -lock-timeout=5m "$PLAN_DIR/commercial-accounts-example-prod-aws-account-baseline.tfplan"

  # ---------------------------------------------------------------------------
  plan-example-prod-workloads:
    name: plan commercial/accounts/example-prod/aws-account-workloads
    # After the baseline of the same account: the account is hardened before
    # anything is put in it. Nothing is resolved from the baseline cell.
    needs: [apply-example-prod-baseline]
    runs-on: ubuntu-latest
    environment: commercial-plan
    concurrency:
      group: aws-cell-commercial-accounts-example-prod-aws-account-workloads
      cancel-in-progress: false
    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
      TG_AWS_DEPLOY_ROLE_NAME: ${{ vars.TG_AWS_DEPLOY_ROLE_NAME || 'identity-as-code-deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-plan-example-prod-workloads-${{ github.run_id }}
      - name: Deployment role profile (from the cell's locators)
        working-directory: tenants/aws/commercial/accounts/example-prod/aws-account-workloads
        run: |
          set -euo pipefail
          # The root gives this cell's provider profile = "identity-as-code-<account_name>"
          # and no assume_role (tenants/aws/root.hcl): a saved plan carries the
          # generated provider with it, and the apply job names a different
          # role than the plan job. This step fills that profile on the runner
          # from the locators beside the cell and this environment's
          # TG_AWS_DEPLOY_ROLE_NAME, chained from the OIDC session already in
          # the environment. The state backend keeps the OIDC session; only
          # the provider uses the profile. The last line proves the chain
          # lands in the account the locator names before Terragrunt runs.
          account_id=$(sed -nE 's/^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"([0-9]{12})".*$/\1/p' ../account.hcl)
          account_name=$(sed -nE 's/^[[:space:]]*account_name[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' ../account.hcl)
          partition=$(sed -nE 's/^[[:space:]]*partition[[:space:]]*=[[:space:]]*"(aws|aws-us-gov)".*$/\1/p' ../../../partition.hcl)
          if [ -z "$account_id" ] || [ -z "$account_name" ] || [ -z "$partition" ]; then
            echo "Could not read account_id and account_name from ../account.hcl and partition from ../../../partition.hcl."
            exit 1
          fi
          profile="identity-as-code-${account_name}"
          aws configure set --profile "$profile" role_arn "arn:${partition}:iam::${account_id}:role/${TG_AWS_DEPLOY_ROLE_NAME}"
          aws configure set --profile "$profile" credential_source Environment
          aws configure set --profile "$profile" role_session_name "aws-release-${{ github.job }}-${{ github.run_id }}"
