  # ---------------------------------------------------------------------------
  plan-gated-wave-3:
    name: plan ${{ matrix.cell.family_path }} (gated wave 3)
    # After gated wave 2 applied: the gated partition's account cells,
    # planned fresh after the gate and applied without a second approval
    # (govcloud-apply carries the writer and a main-only branch policy).
    # Empty today; skipped until GovCloud has a cell in this wave.
    needs: [cells, apply-gated-wave-2]
    if: fromJson(needs.cells.outputs.gated_sizes)[3] > 0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.cells.outputs.gated_waves)[3] }}
    environment: ${{ matrix.cell.tenant }}-plan
    concurrency:
      group: aws-cell-${{ matrix.cell.id }}
      cancel-in-progress: false
    env:
      CELL_ID: ${{ matrix.cell.id }}
      CELL_PATH: ${{ matrix.cell.family_path }}
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
      TG_AWS_DEPLOY_ROLE_NAME: ${{ vars.TG_AWS_DEPLOY_ROLE_NAME || 'identity-as-code-deploy' }}
    steps:
      - uses: actions/checkout@v4
