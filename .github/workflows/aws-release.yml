          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-apply-example-dev-workloads-${{ github.run_id }}
      - name: Deployment role profile (from the cell's locators)
        working-directory: tenants/aws/commercial/accounts/example-dev/aws-account-workloads
        run: |
          set -euo pipefail
          # The root gives this cell's provider profile = "identity-as-code-<account_name>"
          # and no assume_role (tenants/aws/root.hcl): a saved plan carries the
          # generated provider with it, and the apply job names a different
          # role than the plan job. This step fills that profile on the runner
          # from the locators beside the cell and this environment's
          # TG_AWS_DEPLOY_ROLE_NAME, chained from the OIDC session already in
          # the environment. The state backend keeps the OIDC session; only
          # the provider uses the profile. The last line proves the chain
          # lands in the account the locator names before Terragrunt runs.
          account_id=$(sed -nE 's/^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"([0-9]{12})".*$/\1/p' ../account.hcl)
          account_name=$(sed -nE 's/^[[:space:]]*account_name[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' ../account.hcl)
          partition=$(sed -nE 's/^[[:space:]]*partition[[:space:]]*=[[:space:]]*"(aws|aws-us-gov)".*$/\1/p' ../../../partition.hcl)
          if [ -z "$account_id" ] || [ -z "$account_name" ] || [ -z "$partition" ]; then
            echo "Could not read account_id and account_name from ../account.hcl and partition from ../../../partition.hcl."
            exit 1
          fi
          profile="identity-as-code-${account_name}"
          aws configure set --profile "$profile" role_arn "arn:${partition}:iam::${account_id}:role/${TG_AWS_DEPLOY_ROLE_NAME}"
          aws configure set --profile "$profile" credential_source Environment
          aws configure set --profile "$profile" role_session_name "aws-release-${{ github.job }}-${{ github.run_id }}"
          landed=$(aws sts get-caller-identity --profile "$profile" --query Account --output text)
          if [ "$landed" != "$account_id" ]; then
            echo "Profile $profile landed in account $landed, not $account_id."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: aws-plan-commercial-accounts-example-dev-aws-account-workloads-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (saved plan)
        working-directory: tenants/aws/commercial/accounts/example-dev/aws-account-workloads
        run: |
          set -euo pipefail
          terragrunt init -input=false
          terragrunt apply -input=false -lock-timeout=5m "$PLAN_DIR/commercial-accounts-example-dev-aws-account-workloads.tfplan"

  # ---------------------------------------------------------------------------
  plan-govcloud:
    name: plan govcloud/aws-identity-center (merge-time)
    # Same backend guard as plan-commercial; this job has no needs, so it must
    # carry its own. The govcloud-plan environment overrides every variable
    # below with the GovCloud partition's values.
    if: vars.TG_AWS_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    environment: govcloud-plan
    concurrency:
      group: aws-cell-govcloud-aws-identity-center
      cancel-in-progress: false
    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-plan-govcloud-${{ github.run_id }}
      - name: terragrunt plan
        working-directory: tenants/aws/govcloud/aws-identity-center
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/govcloud-aws-identity-center.tfplan"
          terragrunt show -no-color "$PLAN_DIR/govcloud-aws-identity-center.tfplan" > "$PLAN_DIR/govcloud-aws-identity-center.txt"
          terragrunt show -json "$PLAN_DIR/govcloud-aws-identity-center.tfplan" > "$PLAN_DIR/govcloud-aws-identity-center.json"
      - name: Plan summary
        run: |
          set -euo pipefail
          json="$PLAN_DIR/govcloud-aws-identity-center.json"
          add=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' "$json")
          change=$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length' "$json")
          destroy=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$json")
          {
            echo "### GovCloud plan taken at merge (${{ github.sha }})"
            echo "Add: $add, Change: $change, Destroy: $destroy"
            echo ""
            echo "This exact plan file is what apply-govcloud will run after the gate."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-plan-govcloud-aws-identity-center-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/govcloud-aws-identity-center.*
          retention-days: 30

  # ---------------------------------------------------------------------------
  govcloud-gate:
    name: gate (govcloud)
    needs: [apply-commercial, apply-example-prod-payments-api, apply-example-dev-workloads, plan-govcloud]
    runs-on: ubuntu-latest
    # The "govcloud" environment carries required reviewers and a wait timer
    # (Settings -> Environments -> govcloud -> Deployment protection rules).
    # The wait timer is the primary soak; the SOAK_MINUTES sleep below is a
    # belt-and-braces fallback for repositories that have not set the timer.
    environment: govcloud
    steps:
      - name: Soak checklist
        run: |
          cat <<'EOF'
          Commercial has been applied. Before approving GovCloud, confirm:
            1. A member of a commercial group can open the AWS access portal from
               My Apps, sees the expected accounts, and the session ends at the
               permission set's session duration.
            2. The permission sets appear in the commercial Identity Center console
               with the expected policies, and every assigned account shows
               "Provisioned", not "Failed".
            3. No group referenced by the commercial cell is missing from the identity
               store (SCIM from the corp Entra tenant is healthy).
            4. Every commercial account cell applied cleanly: in example-prod the trail
               is delivering to its bucket and GuardDuty is enabled, and in each
               account the roles, keys, and buckets of the workloads cell exist with
               the policies the plan showed.
            5. The GovCloud plan artifact (aws-plan-govcloud-aws-identity-center-<sha>)
               shows the expected change set and no destroys you did not intend.
          EOF
      - name: Documented wait
        env:
          SOAK_MINUTES: ${{ vars.SOAK_MINUTES || '0' }}
        run: |
          set -euo pipefail
          echo "Soaking for ${SOAK_MINUTES} minute(s) beyond the environment wait timer."
          sleep "$(( SOAK_MINUTES * 60 ))"

  # ---------------------------------------------------------------------------
  apply-govcloud:
    name: apply govcloud/aws-identity-center
    needs: [govcloud-gate]
    runs-on: ubuntu-latest
    environment: govcloud-apply
    concurrency:
      group: aws-cell-govcloud-aws-identity-center
      cancel-in-progress: false
    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-apply-govcloud-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: aws-plan-govcloud-aws-identity-center-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (merge-time plan)
        working-directory: tenants/aws/govcloud/aws-identity-center
        run: |
          set -euo pipefail
          terragrunt init -input=false
          # A stale plan (state changed since merge) makes this fail. That is intended:
          # re-run the release so a fresh plan goes back through the gate.
          terragrunt apply -input=false -lock-timeout=5m "$PLAN_DIR/govcloud-aws-identity-center.tfplan"
