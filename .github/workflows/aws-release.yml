          partition=$(sed -nE 's/^[[:space:]]*partition[[:space:]]*=[[:space:]]*"(aws|aws-us-gov)".*$/\1/p' ../../../partition.hcl)
          if [ -z "$account_id" ] || [ -z "$account_name" ] || [ -z "$partition" ]; then
            echo "Could not read account_id and account_name from ../account.hcl and partition from ../../../partition.hcl."
            exit 1
          fi
          profile="identity-as-code-${account_name}"
          aws configure set --profile "$profile" role_arn "arn:${partition}:iam::${account_id}:role/${TG_AWS_DEPLOY_ROLE_NAME}"
          aws configure set --profile "$profile" credential_source Environment
          aws configure set --profile "$profile" role_session_name "aws-release-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}"
          landed=$(aws sts get-caller-identity --profile "$profile" --query Account --output text)
          if [ "$landed" != "$account_id" ]; then
            echo "Profile $profile landed in account $landed, not $account_id."
            exit 1
          fi
      - name: terragrunt plan
        working-directory: tenants/aws/${{ matrix.cell.family_path }}
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/$CELL_ID.tfplan"
          terragrunt show -no-color "$PLAN_DIR/$CELL_ID.tfplan" > "$PLAN_DIR/$CELL_ID.txt"
          terragrunt show -json "$PLAN_DIR/$CELL_ID.tfplan" > "$PLAN_DIR/$CELL_ID.json"
      - name: Plan summary
        # tools/plan_gate report: the counts, with the replace, import, and
        # drift columns the soak checklist asks about (docs/adr/0018).
        run: |
          set -euo pipefail
          python3 tools/plan_gate/plan_gate.py report "$PLAN_DIR/$CELL_ID.json" \
            --github-summary --title "AWS plan: $CELL_PATH (${{ github.sha }})" \
            --json > "$PLAN_DIR/$CELL_ID.gate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-plan-${{ matrix.cell.id }}-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.*
          retention-days: 30

