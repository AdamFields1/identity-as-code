            echo "Profile $profile landed in account $landed, not $account_id."
            exit 1
          fi

      - name: terragrunt plan
        working-directory: tenants/aws/commercial/accounts/example-prod/aws-account-workloads
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/commercial-accounts-example-prod-aws-account-workloads.tfplan"
          terragrunt show -no-color "$PLAN_DIR/commercial-accounts-example-prod-aws-account-workloads.tfplan" > "$PLAN_DIR/commercial-accounts-example-prod-aws-account-workloads.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-plan-commercial-accounts-example-prod-aws-account-workloads-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/commercial-accounts-example-prod-aws-account-workloads.*
          retention-days: 30

  # ---------------------------------------------------------------------------
  apply-example-prod-workloads:
    name: apply commercial/accounts/example-prod/aws-account-workloads
    needs: [plan-example-prod-workloads]
    runs-on: ubuntu-latest
    environment: commercial
    concurrency:
      group: aws-cell-commercial-accounts-example-prod-aws-account-workloads
      cancel-in-progress: false
    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
      TG_AWS_DEPLOY_ROLE_NAME: ${{ vars.TG_AWS_DEPLOY_ROLE_NAME || 'identity-as-code-deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          role-session-name: aws-release-apply-example-prod-workloads-${{ github.run_id }}
      - name: Deployment role profile (from the cell's locators)
        working-directory: tenants/aws/commercial/accounts/example-prod/aws-account-workloads
        run: |
          set -euo pipefail
          # The root gives this cell's provider profile = "identity-as-code-<account_name>"
          # and no assume_role (tenants/aws/root.hcl): a saved plan carries the
          # generated provider with it, and the apply job names a different
          # role than the plan job. This step fills that profile on the runner
          # from the locators beside the cell and this environment's
          # TG_AWS_DEPLOY_ROLE_NAME, chained from the OIDC session already in
