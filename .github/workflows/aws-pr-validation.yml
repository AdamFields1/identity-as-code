# PR validation for the AWS identity-as-code tree (tenants/aws, which holds one
# IAM Identity Center cell per partition and, under
# <partition>/accounts/<account-name>/, the account cells of the baseline,
# the catalog, and the app stacks; docs/adr/0017).
#
# Static checks run on every PR that touches Terraform or Terragrunt under the
# AWS paths. A speculative plan runs only for cells affected by the change: a
# cell whose own directory changed, or every cell when shared code (modules,
# stacks, root.hcl) changed.
#
# Credentials: AWS via GitHub OIDC (aws-actions/configure-aws-credentials with
# a role ARN from a repository variable, no access keys). State is an S3 bucket
# in the cell's own partition, locked with DynamoDB. See docs/adr/0003 and
# docs/adr/0009.
#
# Identity per environment: AWS_PLAN_ROLE_ARN, TG_AWS_STATE_BUCKET,
# TG_AWS_STATE_REGION, and TG_AWS_LOCK_TABLE are repository variables. A
# "<partition>-plan" environment overrides them with that partition's reader
# role and state bucket, because a GovCloud role cannot read a commercial
# bucket and the reverse. GitHub resolves vars.X to the environment value when
# one exists, but only inside a job that names the environment, which is why
# the state variables are set at job level here and not at workflow level.
#
# An account cell's plan additionally runs its provider as the read-only
# deployment role every account carries,
# arn:<partition>:iam::<account id>:role/<TG_AWS_DEPLOY_ROLE_NAME>, where
# TG_AWS_DEPLOY_ROLE_NAME is a repository variable the "<partition>-plan"
# environment overrides with the reader's name. The role is not in any
# generated file: tenants/aws/root.hcl gives an account cell's provider
# profile = "identity-as-code-<account name>" and no assume_role, and the
# "Deployment role profile" step below writes that profile on the runner
# from the locators beside the cell, chained from the OIDC session with
# credential_source = Environment. The state backend keeps the OIDC
# session. The reader deployment role trusts only this partition's plan
# OIDC role, so a pull request can never reach a writer (docs/adr/0003).
#
# Plans run one job per cell instead of a single `terragrunt run --all plan` so
# each cell gets its own artifact, its own PR comment, and its own concurrency
# group. The result is the same set of plans with better attribution.

name: aws-pr-validation

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/aws/**"
      - "stacks/aws-*/**"
      - "stacks/apps/aws/**"
      - "tenants/aws/**"
      - ".tflint.hcl"
      - ".github/workflows/aws-pr-validation.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  TG_VERSION: "0.77.0"
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"

concurrency:
  group: aws-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: fmt, tflint, checkov, validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terragrunt hclfmt
        run: terragrunt hclfmt --check

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          set -euo pipefail
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          skip_path: .terragrunt-cache
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: terraform validate (modules and stacks)
        run: |
          set -euo pipefail
          for dir in modules/aws/* stacks/aws-* stacks/apps/aws/*; do
            [ -d "$dir" ] || continue
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  changed-cells:
    name: Detect affected cells
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.detect.outputs.cells }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          # A cell is any directory under tenants/aws that holds a
          # terragrunt.hcl, found by that file and never by depth
          # (docs/adr/0017): commercial/aws-identity-center is one, and so is
          # commercial/accounts/example-prod/aws-account-baseline; accounts/
          # and accounts/<account-name>/ hold locators, not cells. %P prints
          # the path relative to tenants/aws.
          all_cells=$(find tenants/aws -name terragrunt.hcl -printf '%P\n' | sed 's#/terragrunt\.hcl$##' | sort)

          if echo "$changed" | grep -Eq '^(modules/aws/|stacks/aws-|stacks/apps/aws/|tenants/aws/root\.hcl|\.github/workflows/aws-pr-validation\.yml)'; then
            selected="$all_cells"
          else
            # A cell is affected when a file inside it changed, or when a
            # locator above it changed: partition.hcl addresses every cell in
            # the partition and account.hcl every cell in the account, so an
            # edited locator re-plans the cells it addresses.
            affected() {
              local cell="$1" dir="$1"
              echo "$changed" | grep -Eq "^tenants/aws/${cell}/" && return 0
              while dir=$(dirname "$dir") && [ "$dir" != "." ]; do
                echo "$changed" | grep -Eq "^tenants/aws/${dir}/(partition|account)\.hcl$" && return 0
              done
              return 1
            }
            selected=""
            for cell in $all_cells; do
              if affected "$cell"; then selected="$selected$cell"$'\n'; fi
            done
          fi

          # Matrix entries carry the path, a filesystem-safe id for artifact and
          # concurrency names, and the partition for the environment lookup.
          json=$(printf '%s\n' $selected | { grep -v '^$' || true; } \
            | jq -R '{path: ., id: (. | gsub("/"; "-")), partition: (. | split("/")[0])}' \
            | jq -sc .)
          echo "Affected cells: $json"
          echo "cells=$json" >> "$GITHUB_OUTPUT"

  plan:
    name: plan ${{ matrix.cell.path }}
    needs: [static-checks, changed-cells]
    # Plans need the state backend; static checks above do not, so they always run.
    if: needs.changed-cells.outputs.cells != '[]' && vars.TG_AWS_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.changed-cells.outputs.cells) }}

    # Reader role, partition-local state bucket, and the name of the read-only
    # deployment role an account cell's provider runs as live in the
    # "<partition>-plan" environment. Sharing the per-cell concurrency group
    # with the release workflow means a PR plan never fights a release apply
    # for the state lock.
    environment: ${{ matrix.cell.partition }}-plan
    concurrency:
      group: aws-cell-${{ matrix.cell.id }}
      cancel-in-progress: false

    env:
      TG_AWS_STATE_BUCKET: ${{ vars.TG_AWS_STATE_BUCKET }}
      TG_AWS_STATE_REGION: ${{ vars.TG_AWS_STATE_REGION }}
      TG_AWS_LOCK_TABLE: ${{ vars.TG_AWS_LOCK_TABLE }}
      TG_AWS_DEPLOY_ROLE_NAME: ${{ vars.TG_AWS_DEPLOY_ROLE_NAME || 'identity-as-code-deploy' }}
      PLAN_DIR: ${{ github.workspace }}/plans
      # The cell's names as data: run blocks read $CELL_PATH and $CELL_ID,
      # never the matrix expression, so a directory name is never script.
      CELL_PATH: ${{ matrix.cell.path }}
      CELL_ID: ${{ matrix.cell.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TG_AWS_STATE_REGION }}
          # STS caps a session name at 64 characters and an account cell's id
          # alone is longer; the run, attempt, and matrix index are unique
          # per job and the cell is in the job name.
          role-session-name: aws-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}

      - name: Deployment role profile (account cells only)
        working-directory: tenants/aws/${{ matrix.cell.path }}
        run: |
          set -euo pipefail
          # An account cell has account.hcl above it and partition.hcl above
          # that (tenants/aws/root.hcl, ADDRESSING). The root gives its
          # provider profile = "identity-as-code-<account_name>" and no
          # assume_role; this step fills that profile on the runner with the
          # deployment role this environment names, chained from the OIDC
          # session already in the environment. The role name never enters
          # the plan file. A partition-wide cell has no locator and nothing
          # to do. The last line proves the chain lands in the account the
          # locator names before Terragrunt runs.
          # The locators are found by walking up from the cell, the way the
          # root does with find_in_parent_folders: an app cell sits under
          # apps/<app>/ and an app-scoped catalog cell one level further
          # down, so the depth is not fixed. The walk stops at the directory
          # that holds root.hcl.
          account_locator=""
          partition_locator=""
          d="$PWD"
          until [ -f "$d/root.hcl" ] || [ "$d" = "/" ]; do
            d=$(dirname "$d")
            if [ -z "$account_locator" ] && [ -f "$d/account.hcl" ]; then
              account_locator="$d/account.hcl"
            fi
            if [ -z "$partition_locator" ] && [ -f "$d/partition.hcl" ]; then
              partition_locator="$d/partition.hcl"
            fi
          done
          if [ -z "$account_locator" ]; then
            echo "No account locator above this cell; the OIDC session is the identity."
            exit 0
          fi
          account_id=$(sed -nE 's/^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"([0-9]{12})".*$/\1/p' "$account_locator")
          account_name=$(sed -nE 's/^[[:space:]]*account_name[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' "$account_locator")
          partition=$(sed -nE 's/^[[:space:]]*partition[[:space:]]*=[[:space:]]*"(aws|aws-us-gov)".*$/\1/p' "${partition_locator:-/dev/null}")
          if [ -z "$account_id" ] || [ -z "$account_name" ] || [ -z "$partition" ]; then
            echo "Could not read account_id and account_name from ${account_locator} and partition from ${partition_locator:-a partition.hcl above the cell}."
            exit 1
          fi
          profile="identity-as-code-${account_name}"
          aws configure set --profile "$profile" role_arn "arn:${partition}:iam::${account_id}:role/${TG_AWS_DEPLOY_ROLE_NAME}"
          aws configure set --profile "$profile" credential_source Environment
          aws configure set --profile "$profile" role_session_name "aws-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}"
          landed=$(aws sts get-caller-identity --profile "$profile" --query Account --output text)
          if [ "$landed" != "$account_id" ]; then
            echo "Profile $profile landed in account $landed, not $account_id."
            exit 1
          fi

      - name: terragrunt plan
        working-directory: tenants/aws/${{ matrix.cell.path }}
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/$CELL_ID.tfplan"
          terragrunt show -no-color "$PLAN_DIR/$CELL_ID.tfplan" > "$PLAN_DIR/$CELL_ID.txt"
          terragrunt show -json "$PLAN_DIR/$CELL_ID.tfplan" > "$PLAN_DIR/$CELL_ID.json"

      - name: Plan gate
        id: gate
        # tools/plan_gate holds the plan JSON to the convergence profile and
        # writes its table to the step summary (docs/adr/0018). The verdict
        # is a report, not a block: a pull request's plan is the change
        # under review, so "not converged" goes into the summary and the
        # comment and the reviewer decides. One thing is a block. imports.tf
        # is a one-shot workstation file that git ignores (README, adopting
        # an existing tenant), so an import block in a pull request plan came
        # from a stack's .tf files and would adopt a live object on merge
        # without the zero-change gate of tests/README.md having read it; the
        # job is red until it is gone. Exit 2 is a workflow bug (the plan
        # JSON could not be read) and fails the job either way.
        run: |
          set -euo pipefail
          json="$PLAN_DIR/$CELL_ID.json"
          gate="$PLAN_DIR/$CELL_ID.gate.json"
          code=0
          python3 tools/plan_gate/plan_gate.py convergence "$json" \
            --github-summary --title "AWS plan: $CELL_PATH" \
            --json > "$gate" || code=$?
          echo "profile=convergence" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "verdict=pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=fail" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::plan_gate exited $code for $CELL_PATH: the plan JSON could not be gated. A workflow bug, not a tenant problem."
              exit "$code"
              ;;
          esac
          imports=$(jq '.plans[0].counts.imports' "$gate")
          if [ "$imports" -gt 0 ]; then
            echo "::error::$CELL_PATH plans $imports import block(s) in a pull request. Imports are adopted from a workstation through imports.tf behind the zero-change gate (tests/README.md), never from a pull request; remove the import blocks."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::$CELL_PATH is not converged: this plan changes the tenant. The addresses are in the step summary."
          fi

      - name: Summarise plan
        id: summary
        # The three counts the comment carries; the step summary table is the
        # gate's, above, with the replace, import, and drift columns jq does
        # not see.
        run: |
          set -euo pipefail
          json="$PLAN_DIR/$CELL_ID.json"
          add=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' "$json")
          change=$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length' "$json")
          destroy=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$json")
          echo "add=$add" >> "$GITHUB_OUTPUT"
          echo "change=$change" >> "$GITHUB_OUTPUT"
          echo "destroy=$destroy" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        # Uploaded even when the gate is red, so the plan that
        # failed the gate can be read; nothing to upload when the plan
        # itself failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: aws-plan-${{ matrix.cell.id }}-pr${{ github.event.pull_request.number }}
          path: |
            ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.tfplan
            ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.txt
            ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.json
            ${{ env.PLAN_DIR }}/${{ matrix.cell.id }}.gate.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Post plan summary as PR comment
        uses: actions/github-script@v7
        env:
          ADD: ${{ steps.summary.outputs.add }}
          CHANGE: ${{ steps.summary.outputs.change }}
          DESTROY: ${{ steps.summary.outputs.destroy }}
          GATE_PROFILE: ${{ steps.gate.outputs.profile }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        with:
          script: |
            const fs = require('fs');
            const cellPath = process.env.CELL_PATH;
            const cellId = process.env.CELL_ID;
            const marker = `<!-- aws-plan:${cellId} -->`;
            const planPath = `${process.env.PLAN_DIR}/${cellId}.txt`;
            let plan = fs.readFileSync(planPath, 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n... truncated, full plan in the workflow artifact ...';
            }
            const destroyWarning = process.env.DESTROY !== '0'
              ? '\n\n**Warning: this plan destroys resources. Review carefully.**'
              : '';
            const gateLine = process.env.GATE_VERDICT === 'pass'
              ? `Plan gate (${process.env.GATE_PROFILE}): **pass**`
              : `Plan gate (${process.env.GATE_PROFILE}): **not converged**, this plan changes the tenant; the addresses are in the job's step summary`;
            const body = [
              marker,
              `### AWS plan for \`${cellPath}\``,
              `Add: **${process.env.ADD}**, Change: **${process.env.CHANGE}**, Destroy: **${process.env.DESTROY}**${destroyWarning}`,
              gateLine,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
              '',
              `Artifact: \`aws-plan-${cellId}-pr${context.issue.number}\``
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
