# Release train for the Azure identity-as-code tree.
#
#   push to main
#     |-- plan-corp-roles ---> apply-corp-roles ---> plan-corp-pim ---> apply-corp-pim
#     |                                                                      |
#     |                                          plan-corp-automation ---> apply-corp-automation
#     |                                          apply-corp-auth-methods ----+
#     |                                                                      |
#     |                    sub-example-prod: plan/apply azure-subscription-baseline
#     |                                        ---> plan/apply azure-subscription-workloads
#     |                                        ---> plan/apply data-pipeline
#     |                                                                      \
#     |-- plan-subsidiary-pim (merge-time plan, saved as artifact)            \
#                 \                                                            \
#                  subsidiary-gate (environment: subsidiary, reviewers + wait timer)
#                       |
#                  apply-subsidiary-pim (environment: subsidiary-apply, applies the merge-time plan)
#
# Corp is the first tenant, the way dev is for Okta. Its cells run in a fixed
# order: the governance cell resolves custom roles by name at plan time, so
# the roles cell must be applied before the governance cell can even plan.
# That is the ordering cost of keeping definitions and assignments in separate
# cells (docs/adr/0005), paid here rather than in a tenant file. The
# automation cell resolves custom roles from the roles cell by name for its
# identities' role assignments (docs/adr/0014 and 0016), which the order below
# already satisfies; it follows the governance cell so that corp is completely
# applied before the subsidiary gate opens. A pull request that adds a custom
# role and its first use in the same change plans red in the consuming cell
# until this train has applied the roles cell, which is why role definitions
# land in their own pull request first (README.md, "Verification status").
# The authentication methods policy is not a Terraform
# cell at all (docs/adr/0012): apply-corp-auth-methods runs the desired-state
# script after apply-corp-pim, because the policy names groups that cell
# creates, and the gate waits for it like any other corp apply.
#
# Subscription cells (docs/adr/0017) follow the corp tenant cells, one chain
# per subscription under the corp environments, the subscriptions in parallel
# because their state files are separate. Inside a subscription the order is
# one rule for every subscription: azure-subscription-baseline first, then
# the catalog (azure-subscription-workloads) and the app stacks under
# stacks/apps/azure side by side. The baseline goes first because it creates
# the Log Analytics workspace the other cells name for their audit logs,
# resolved by name at plan time: the same coupling as a custom role and the
# same ordering cost. The subscription itself is addressed by the locator
# beside each cell, so the corp identities and ARM_SUBSCRIPTION_ID do not
# change. The gate waits for the last apply of every subscription, so corp
# is complete before the subsidiary opens. The subsidiary has no subscription
# cells yet; when it does, they follow apply-subsidiary-pim under the
# subsidiary environments.
#
# Subsidiary is the gated tenant, the way prod is for Okta. Its plan is taken
# at merge time and saved; the reviewer approves that exact plan. If subsidiary
# state moves between merge and approval, Terraform refuses the stale plan and
# the release must be re-run, which is the safe failure.
#
# Credentials: Azure via GitHub OIDC (azure/login@v2 with a federated
# credential, no client secret). State uses the same Entra token; there is no
# storage account key anywhere in this pipeline. See docs/adr/0004.
#
# Environments (configured in repository settings, no secrets in this repo).
# AZ_CLIENT_ID, AZ_TENANT_ID, and AZ_SUBSCRIPTION_ID are repository variables
# that each environment overrides with its own identity and tenant:
#   corp-plan          reader identity for corp, plan only
#   corp               writer identity for corp
#   subsidiary-plan    reader identity for the subsidiary tenant, plan only
#   subsidiary         no identity; carries the required reviewers and the wait timer
#   subsidiary-apply   writer identity for the subsidiary; deployment branch policy: main only
#
# The writer identity lives in subsidiary-apply rather than subsidiary so the
# reviewer approves once, at the gate. apply-subsidiary-pim cannot start
# without subsidiary-gate succeeding.

name: azure-release

on:
  push:
    branches: [main]
    paths:
      - "modules/azure/**"
      - "modules/entra/**"
      - "stacks/azure-*/**"
      - "stacks/apps/azure/**"
      - "stacks/entra-*/**"
      - "tenants/azure/**"
      - "automation/runbooks/**"
      - "automation/lib/**"
      - "policies/entra/authentication-methods/**"
      - "policies/azure/pim-governance/**"
      - "policies/entra/pim-governance/**"
      - "scripts/Set-AuthenticationMethods.ps1"
      - ".github/workflows/azure-release.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  TG_VERSION: "0.77.0"
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  TG_AZ_STATE_RG: ${{ vars.TG_AZ_STATE_RG }}
  TG_AZ_STATE_SA: ${{ vars.TG_AZ_STATE_SA }}
  TG_AZ_STATE_CONTAINER: ${{ vars.TG_AZ_STATE_CONTAINER || 'tfstate' }}
  PLAN_DIR: ${{ github.workspace }}/plans

# Releases queue behind each other and are never cancelled mid-apply.
concurrency:
  group: azure-release-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  plan-corp-roles:
    name: plan corp/azure-rbac-roles
    # Skip the whole train until the repo variables for the state backend exist.
    # Without this guard every push to main would fail on a portfolio repo that
    # has no live backend behind it. Downstream jobs inherit the skip through needs.
    if: vars.TG_AZ_STATE_SA != ''
    runs-on: ubuntu-latest
    environment: corp-plan
    concurrency:
      group: azure-cell-corp-azure-rbac-roles
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: terragrunt plan
        working-directory: tenants/azure/corp/azure-rbac-roles
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/corp-azure-rbac-roles.tfplan"
          terragrunt show -no-color "$PLAN_DIR/corp-azure-rbac-roles.tfplan" > "$PLAN_DIR/corp-azure-rbac-roles.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: azure-plan-corp-azure-rbac-roles-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/corp-azure-rbac-roles.*
          retention-days: 30

  # ---------------------------------------------------------------------------
  apply-corp-roles:
    name: apply corp/azure-rbac-roles
    needs: [plan-corp-roles]
    runs-on: ubuntu-latest
    environment: corp
    concurrency:
      group: azure-cell-corp-azure-rbac-roles
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: azure-plan-corp-azure-rbac-roles-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (saved plan)
        working-directory: tenants/azure/corp/azure-rbac-roles
        run: |
          set -euo pipefail
          terragrunt init -input=false
          terragrunt apply -input=false -lock-timeout=5m "$PLAN_DIR/corp-azure-rbac-roles.tfplan"

  # ---------------------------------------------------------------------------
  plan-corp-pim:
    name: plan corp/azure-pim-governance
    # Only after the roles cell has applied: custom roles are resolved by name
    # at plan time, so a new role and its first eligibility land in one release.
    needs: [apply-corp-roles]
    runs-on: ubuntu-latest
    environment: corp-plan
    concurrency:
      group: azure-cell-corp-azure-pim-governance
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: terragrunt plan
        working-directory: tenants/azure/corp/azure-pim-governance
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/corp-azure-pim-governance.tfplan"
          terragrunt show -no-color "$PLAN_DIR/corp-azure-pim-governance.tfplan" > "$PLAN_DIR/corp-azure-pim-governance.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: azure-plan-corp-azure-pim-governance-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/corp-azure-pim-governance.*
          retention-days: 30

  # ---------------------------------------------------------------------------
  apply-corp-pim:
    name: apply corp/azure-pim-governance
    needs: [plan-corp-pim]
    runs-on: ubuntu-latest
    environment: corp
    concurrency:
      group: azure-cell-corp-azure-pim-governance
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: azure-plan-corp-azure-pim-governance-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (saved plan)
        working-directory: tenants/azure/corp/azure-pim-governance
        run: |
          set -euo pipefail
          terragrunt init -input=false
          terragrunt apply -input=false -lock-timeout=5m "$PLAN_DIR/corp-azure-pim-governance.tfplan"

  # ---------------------------------------------------------------------------
  plan-corp-automation:
    name: plan corp/azure-automation
    # After the governance cell only so corp is fully applied before the gate;
    # nothing here is resolved from the other corp cells at plan time.
    needs: [apply-corp-pim]
    runs-on: ubuntu-latest
    environment: corp-plan
    concurrency:
      group: azure-cell-corp-azure-automation
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: terragrunt plan
        working-directory: tenants/azure/corp/azure-automation
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/corp-azure-automation.tfplan"
          terragrunt show -no-color "$PLAN_DIR/corp-azure-automation.tfplan" > "$PLAN_DIR/corp-azure-automation.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: azure-plan-corp-azure-automation-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/corp-azure-automation.*
          retention-days: 30

  # ---------------------------------------------------------------------------
  apply-corp-automation:
    name: apply corp/azure-automation
    needs: [plan-corp-automation]
    runs-on: ubuntu-latest
    environment: corp
    concurrency:
      group: azure-cell-corp-azure-automation
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: azure-plan-corp-azure-automation-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (saved plan)
        working-directory: tenants/azure/corp/azure-automation
        run: |
          set -euo pipefail
          terragrunt init -input=false
          terragrunt apply -input=false -lock-timeout=5m "$PLAN_DIR/corp-azure-automation.tfplan"

  # ---------------------------------------------------------------------------
  apply-corp-auth-methods:
    name: apply corp authentication methods policy
    # Not a Terraform cell: the authentication methods policy has no resource
    # in the azuread provider and its objects are patch-only singletons
    # (docs/adr/0012). scripts/Set-AuthenticationMethods.ps1 reads the JSON
    # under policies/entra/authentication-methods, resolves group names, and
    # patches the drift. It follows apply-corp-pim because the policy names
    # groups that cell creates. The corp writer identity needs
    # Policy.ReadWrite.AuthenticationMethod and Group.Read.All on Graph; the
    # token comes from the same OIDC login as the Terraform jobs and is never
    # written to a file, a step output, or the log.
    needs: [apply-corp-pim]
    runs-on: ubuntu-latest
    environment: corp
    concurrency:
      group: azure-corp-authentication-methods
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: Set-AuthenticationMethods (enforce)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = (az account get-access-token --resource-type ms-graph --query accessToken -o tsv | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'The Azure CLI returned no Microsoft Graph token.' }
          $token = $token.Trim()
          Write-Output "::add-mask::$token"
          ./scripts/Set-AuthenticationMethods.ps1 -DesiredStatePath ./policies/entra/authentication-methods `
            -DryRun:$false -FailOnDrift:$false -AccessToken $token -ReportPath ./out/auth-methods-corp.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-auth-methods-corp-${{ github.sha }}
          path: out/auth-methods-corp.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  plan-corp-sub-example-prod-baseline:
    name: plan corp/subscriptions/sub-example-prod/azure-subscription-baseline
    # First subscription cell, after every corp tenant cell has applied. The
    # subscription is addressed by the locator beside the cell, not by
    # ARM_SUBSCRIPTION_ID, which the corp environments still export for the
    # tenant-wide cells (docs/adr/0017). The corp writer needs the roles the
    # stack README lists at this subscription.
    needs: [apply-corp-automation, apply-corp-auth-methods]
    runs-on: ubuntu-latest
    environment: corp-plan
    concurrency:
      group: azure-cell-corp-subscriptions-sub-example-prod-azure-subscription-baseline
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: terragrunt plan
        working-directory: tenants/azure/corp/subscriptions/sub-example-prod/azure-subscription-baseline
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/corp-subscriptions-sub-example-prod-azure-subscription-baseline.tfplan"
          terragrunt show -no-color "$PLAN_DIR/corp-subscriptions-sub-example-prod-azure-subscription-baseline.tfplan" > "$PLAN_DIR/corp-subscriptions-sub-example-prod-azure-subscription-baseline.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: azure-plan-corp-subscriptions-sub-example-prod-azure-subscription-baseline-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}/corp-subscriptions-sub-example-prod-azure-subscription-baseline.*
          retention-days: 30

  # ---------------------------------------------------------------------------
  apply-corp-sub-example-prod-baseline:
    name: apply corp/subscriptions/sub-example-prod/azure-subscription-baseline
    needs: [plan-corp-sub-example-prod-baseline]
    runs-on: ubuntu-latest
    environment: corp
    concurrency:
      group: azure-cell-corp-subscriptions-sub-example-prod-azure-subscription-baseline
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: azure-plan-corp-subscriptions-sub-example-prod-azure-subscription-baseline-${{ github.sha }}
          path: ${{ env.PLAN_DIR }}
      - name: terragrunt apply (saved plan)
        working-directory: tenants/azure/corp/subscriptions/sub-example-prod/azure-subscription-baseline
        run: |
          set -euo pipefail
          terragrunt init -input=false
          terragrunt apply -input=false -lock-timeout=5m "$PLAN_DIR/corp-subscriptions-sub-example-prod-azure-subscription-baseline.tfplan"

  # ---------------------------------------------------------------------------
  plan-corp-sub-example-prod-workloads:
    name: plan corp/subscriptions/sub-example-prod/azure-subscription-workloads
    # After the baseline of the same subscription: the vault and the storage
    # account audit to the workspace the baseline creates, resolved by name
    # (the dependencies block in the cell says the same for run --all).
    needs: [apply-corp-sub-example-prod-baseline]
    runs-on: ubuntu-latest
    environment: corp-plan
    concurrency:
      group: azure-cell-corp-subscriptions-sub-example-prod-azure-subscription-workloads
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZ_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZ_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: terragrunt plan
        working-directory: tenants/azure/corp/subscriptions/sub-example-prod/azure-subscription-workloads
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          terragrunt init -input=false
          terragrunt plan -input=false -lock-timeout=5m -out="$PLAN_DIR/corp-subscriptions-sub-example-prod-azure-subscription-workloads.tfplan"
          terragrunt show -no-color "$PLAN_DIR/corp-subscriptions-sub-example-prod-azure-subscription-workloads.tfplan" > "$PLAN_DIR/corp-subscriptions-sub-example-prod-azure-subscription-workloads.txt"
      - uses: actions/upload-artifact@v4
        with:
