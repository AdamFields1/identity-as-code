  prod-gate:
    name: soak gate (prod)
    # Every dev wave is in needs, plan and apply both, so a red plan whose
    # apply was therefore skipped still shows as a failure here; an empty
    # wave shows as skipped and is fine. The gate runs only when the
    # merge-time plan exists, which is only when prod has a cell.
    needs: [cells, plan-wave-0, apply-wave-0, plan-wave-1, apply-wave-1, plan-wave-2, apply-wave-2, plan-wave-3, apply-wave-3, plan-gated-wave-0]
    if: >-
      !cancelled()
      && needs.cells.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && needs.plan-gated-wave-0.result == 'success'
    runs-on: ubuntu-latest
    # No cloud step here, so no OIDC token and no Okta token: the gate is
    # the reviewers and the timer.
    permissions: {}
    # The "prod" environment carries required reviewers and a wait timer
    # (Settings -> Environments -> prod -> Deployment protection rules).
    # The wait timer is the primary soak; the SOAK_MINUTES sleep below is a
    # belt-and-braces fallback for repositories that have not set the timer.
    environment: prod
    steps:
      - name: Soak checklist
        env:
          GATED: ${{ needs.cells.outputs.gated_waves }}
        run: |
          cat <<'EOF'
          Dev has been applied. Before approving prod, confirm:
            1. Dev sign-in works from inside and outside the corporate zone.
            2. MFA enrollment prompts appear for a fresh dev test user.
            3. Password reset and unlock still work for a dev test user.
            4. A dev test user in the payroll and orders groups reaches Example
               Payroll over SAML and the orders portal over OIDC under the
               standard-workforce policy, and a user outside those groups is
               refused the tile.
            5. Each prod plan artifact listed below shows the expected change set
               and no destroys you did not intend; the plan_gate table in the
               merge-time plan job's step summary has the replace and drift columns.
          EOF
          echo "$GATED" | jq -r '.[0][] | "               okta-plan-" + .id + "-${{ github.sha }}"'
      - name: Documented wait
        env:
          SOAK_MINUTES: ${{ vars.SOAK_MINUTES || '0' }}
        run: |
          set -euo pipefail
          echo "Soaking for ${SOAK_MINUTES} minute(s) beyond the environment wait timer."
          sleep "$(( SOAK_MINUTES * 60 ))"

