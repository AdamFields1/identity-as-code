    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.cells.outputs.gated_waves)[2] }}
    environment: ${{ matrix.cell.tenant }}-apply
    concurrency:
      group: okta-cell-${{ matrix.cell.id }}
      cancel-in-progress: false
    env:
      CELL_ID: ${{ matrix.cell.id }}
      CELL_PATH: ${{ matrix.cell.family_path }}
